quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/books-db

quarkus.http.port=8080

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS


# AUTHORS API
quarkus.stork.authors-api.service-discovery.type=static-list
quarkus.stork.authors-api.service-discovery.address-list=localhost:8070,localhost:8071
quarkus.stork.authors-api.load-balancer.type=round-robin

# DEMO API
quarkus.stork.demo-api.service-discovery.type=static-list
quarkus.stork.demo-api.service-discovery.address-list=localhost:8080,localhost:8081
quarkus.stork.demo-api.load-balancer.type=round-robin